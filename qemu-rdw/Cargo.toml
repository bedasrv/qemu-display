[package]
name = "qemu-rdw"
version = "0.1.0"
authors = ["Marc-André Lureau <marcandre.lureau@redhat.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
qmp = ["qemu-display/qmp"]

[dependencies]
rdw-qemu = { package = "rdw4-qemu", version = "0.1" }
log = "0.4"
pretty_env_logger = "0.5"
zbus.workspace = true
qemu-display.workspace = true
futures-util = "0.3"
tracing-subscriber = { version = "0.3.18", features = ["env-filter" , "fmt"], default-features = false }

[target.'cfg(unix)'.dependencies]
rdw = { package = "rdw4", version = "0.1" }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.1.0"
rdw = { package = "rdw4", version = "0.1", default-features = false }
