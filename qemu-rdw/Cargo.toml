[package]
name = "qemu-rdw"
version = "0.1.0"
authors = ["Marc-André Lureau <marcandre.lureau@redhat.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
qmp = ["qemu-display/qmp"]

[dependencies]
log = "0.4"
pretty_env_logger = "0.5"
once_cell = "1.19"
zbus.workspace = true
qemu-display.workspace = true
keycodemap.workspace = true
futures-util = "0.3"
futures = "0.3"
async-trait = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter" , "fmt"], default-features = false }

[target.'cfg(unix)'.dependencies]
rdw = { package = "rdw4", git = "https://gitlab.gnome.org/bilelmoussaoui/rdw/", branch = "bilelmoussaoui/rdw-update", version = "0.1" }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.1.0"
windows = { version = "0.43.0", features = ["Win32_System_Memory", "Win32_Foundation"] }
rdw = { package = "rdw4", git = "https://gitlab.gnome.org/bilelmoussaoui/rdw/", branch = "bilelmoussaoui/rdw-update", version = "0.1", default-features = false }

[[bin]]
path = "./demo/main.rs"
name = "demo"